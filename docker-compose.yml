services:
  backend:
    build: ./backend
    working_dir: /workspace/RiskGraph
    volumes:
      - .:/workspace/RiskGraph
    environment:
      DATA_DIR: /workspace/data/raw
      MODEL_DIR: /workspace/RiskGraph/riskgraph_download/riskgraph_final_model
      OUTPUT_DIR: /workspace/RiskGraph/riskgraph_download/riskgraph_outputs
    ports: ["8000:8000"]
  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes: ["./frontend:/app"]
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports: ["5173:5173"]
